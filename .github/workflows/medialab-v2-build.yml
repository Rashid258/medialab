name: MediaLab V2 - Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract complete Java source
        run: |
          set -euo pipefail
          test -f MediaLab_V2_Java_Source.zip
          unzip -tqq MediaLab_V2_Java_Source.zip
          unzip -qo MediaLab_V2_Java_Source.zip
          sed -i 's/setTextAllCaps(false)/setAllCaps(false)/' app/src/main/java/pk/tearnova/medialab/Palette.java
          test -f app/src/main/java/pk/tearnova/medialab/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature and manifest
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n '1,15p'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLab-V2-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
