name: MediaLab V3.1 - Java APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack MediaLab V3.1 source
        shell: bash
        run: |
          set -euo pipefail
          unzip -tqq MediaLab_V31_Java_Source.zip
          unzip -qo MediaLab_V31_Java_Source.zip
          test -f app/src/main/java/pk/tearnova/medialab/DownloadService.java
          test -f app/src/main/java/pk/tearnova/medialab/ResumePolicy.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test resume logic without Android SDK
        run: |
          mkdir -p /tmp/range-test
          javac -d /tmp/range-test app/src/main/java/pk/tearnova/medialab/ResumePolicy.java tests/pk/tearnova/medialab/ResumePolicyTest.java
          java -cp /tmp/range-test pk.tearnova.medialab.ResumePolicyTest
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signature and package
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLab-V31-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
